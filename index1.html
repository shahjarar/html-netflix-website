<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Netflix Login</title>

    <style>
        body{
     margin:0;
     font-family:Arial, sans-serif ;
     background:url("https://assets.nflxext.com/ffe/siteui/vlv3/9c0e1c3c-3b9d-4f66-8a5a-0b1b4c7d8d89/cover.jpg") ;
     background-size:cover;
     background-position:center;
        }
    .overlay{
        background-color: rgba(0,0,0,0.7);
        height:100hv;
        display:flex;
        justify-content:center;
        align-items:center;
    }
    .login-box{
        background-color: rgba(0,0,0,0.85);
        padding:40px;
        width:300px;
        color:white;
        border-radius:5px;
    }
    h1  {
        color:#e50914;
        text-align:center;

    }
    input{
        width:100px;
        padding:10px;
        margin:10px 0;
        border:none;
        border-radius:3px;
    }
    button{
        width:100px;
        padding:10px;
        background-color:#e50914;
        color:white;
        border:none;
        border-radius: 3px;
        font-size:16px;
        cursor:pointer ;
    }

button:hover{
    background-color: #e50914;

}
 .option {
    display:flex;
    justify-content:space-between;
    font-size:12px;
    margin-top: 10px;



}
a  { 
 color:#b3b3b3;
 text-decoration: none;

    }
    a:hover {
        text-decoration:underline;

    }
    </style>
</head>

<body>

<div class="overlay">
    <div class="login-box">
        <h1>NETFLIX</h1>

        <form>
            <input type="email" placeholder="Email or Phone Number" required>
            <input type="password" placeholder="Password" required>

            <button type="submit">Sign In</button>

            <div class="options">
                <label><input type="checkbox"> Remember me</label>
                <a href="#">Need help?</a>
            </div>
        </form>
    </div>
</div>

</body>
</html>
